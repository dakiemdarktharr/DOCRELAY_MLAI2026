# DEPRECATED HISTORICAL BLUEPRINT — generic PostgreSQL scaffold only.
# Current recorded deployment is Vercel + MongoDB; see docs/RELEASE-MATRIX.md.
# This retained blueprint is still executable: do not select it for current deployment.
services:
  - type: web
    name: mlai-vng-generic-skeleton
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mlai-vng-postgres
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: ENVIRONMENT
        value: production

databases:
  - name: mlai-vng-postgres
    databaseName: mlai_generic
    user: mlai_generic
    plan: free
